<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dooo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/icons.js"></script>
  <script defer src="js/util.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/window.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="stage">
    <article class="floating-card" id="panel">
      <button class="project-summary" id="project-toggle" aria-expanded="false" aria-controls="task-dropdown" title="Click to expand · Drag to move">
        <span class="project-copy">
          <span class="project-name" id="project-name"></span>
          <span class="project-subtitle" id="project-subtitle"></span>
          <span class="project-count"><i data-icon="circle-check"></i><span id="task-count"></span><i class="expand-chevron" data-icon="chevron-down"></i></span>
        </span>
        <span class="project-progress" id="project-progress" role="img">
          <svg viewBox="0 0 56 56" aria-hidden="true"><circle class="progress-track" cx="28" cy="28" r="23"/><circle class="progress-value" id="progress-value" cx="28" cy="28" r="23" pathLength="100"/></svg>
          <span class="progress-number" id="progress-number" aria-hidden="true"></span>
        </span>
      </button>
      <button class="hide-project icon-btn" id="hide-project" aria-label="Minimize project" title="Minimize project"><i data-icon="minus"></i></button>
      <section class="task-dropdown" id="task-dropdown" aria-label="Project tasks" inert>
        <div class="task-toolbar">
          <button class="icon-btn" id="rename-project" aria-label="Rename project" title="Rename project"><i data-icon="pencil"></i></button>
          <button class="icon-btn" id="task-menu-toggle" aria-label="Project options" aria-haspopup="menu" aria-expanded="false"><i data-icon="ellipsis"></i></button>
        </div>
        <form class="rename-form" id="rename-form" hidden>
          <input id="rename-input" aria-label="Project name" maxlength="48" required>
          <button class="icon-btn" type="submit" aria-label="Save project name" title="Save project name"><i data-icon="check"></i></button><button class="icon-btn" type="button" id="rename-cancel" aria-label="Cancel rename" title="Cancel"><i data-icon="x"></i></button>
        </form>
        <div class="task-list" id="list" role="list" aria-label="Tasks"></div>
        <div class="toast" id="toast" role="status" hidden><span class="sr-only" id="toast-text"></span><button class="icon-btn" id="toast-undo" aria-label="Undo last action" title="Undo"><i data-icon="rotate-ccw"></i></button></div>
        <form class="composer" id="sheet" aria-label="Add a task">
          <div class="composer-line">
            <textarea id="task-input" aria-label="Task" rows="1" maxlength="300" placeholder="Add a task…" disabled></textarea>
            <button class="submit-btn" id="task-submit" type="submit" aria-label="Add task" title="Add task" hidden><i data-icon="arrow-up"></i></button>
          </div>
          <div class="composer-tools">
            <button class="icon-btn" id="details-toggle" type="button" aria-label="Task details" title="Task details" aria-expanded="false" aria-controls="task-details"><i data-icon="sliders"></i></button>
            <button class="icon-btn" id="edit-cancel" type="button" aria-label="Cancel editing" title="Cancel editing" hidden><i data-icon="x"></i></button>
          </div>
          <div class="task-details" id="task-details" hidden>
            <label>Priority<select id="task-priority"><option value="none">None</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
            <label>Date<input type="date" id="due-date" aria-label="Due date"></label>
            <label>Time<input type="time" id="due-time" aria-label="Due time"></label>
            <button class="icon-btn" type="button" id="details-clear" aria-label="Clear details" title="Clear details"><i data-icon="eraser"></i></button>
          </div>
        </form>
      </section>
      <div class="task-menu" id="task-menu" role="menu" hidden>
        <button role="menuitem" id="clear-completed" aria-label="Clear completed tasks" title="Clear completed tasks"><i data-icon="list-checks"></i></button>
        <button role="menuitem" id="menu-minimize" aria-label="Minimize project" title="Minimize project"><i data-icon="minus"></i></button>
      </div>
      <button type="button" class="resize-grip" id="resize-grip" aria-label="Resize project" title="Drag to resize, or use arrow keys" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 13 13 5M10 13l3-3"/></svg></button>
    </article>
  </div>
</body>
</html>
